{% macro post_card(post) %}
<article class="card bg-white shadow-card hover:shadow-cardhover hover:-translate-y-0.5 transition-all duration-200 rounded-2xl overflow-hidden relative">
  <a href="{{ url_for('detail', post_id=post.id) }}" class="block">
    <figure class="relative aspect-[16/10] overflow-hidden bg-brand-50">
      <img src="{{ post.image_url }}" alt="{{ post.store_name }}" class="w-full h-full object-cover" loading="lazy">
      {% if post.expired %}
      <span class="absolute inset-0 bg-slate-900/45 flex items-center justify-center text-white font-bold tracking-widest">終了しました</span>
      {% endif %}
      <span class="absolute top-3 left-3 badge bg-accentlime text-white border-none font-bold shadow">-{{ post.discount_rate }}%</span>
      {% if post.is_demo %}
      <span class="absolute bottom-3 left-3 badge badge-sm bg-white/90 border-none text-slate-500">デモデータ</span>
      {% endif %}
    </figure>
    <div class="p-4 space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="badge badge-sm bg-brand-50 text-brand-700 border-none font-semibold">{{ post.genre }}</span>
        <span class="text-slate-400 flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i>{{ post.area }}・{{ post.station }}</span>
      </div>
      <h3 class="font-bold text-[15px] leading-snug line-clamp-1">{{ post.store_name }}</h3>
      <p class="text-[13px] text-slate-500 leading-relaxed line-clamp-2 min-h-[2.6em]">{{ post.description }}</p>
      <div class="flex items-end justify-between pt-1">
        <p class="flex items-baseline gap-1.5">
          <span class="text-xs text-slate-400 line-through">¥{{ "{:,}".format(post.regular_price) }}</span>
          <span class="text-lg font-extrabold text-brand-600">¥{{ "{:,}".format(post.student_price) }}</span>
        </p>
        <span class="text-xs text-slate-400 flex items-center gap-1">
          <i data-lucide="heart" class="w-3.5 h-3.5"></i>{{ post.likes }}
        </span>
      </div>
      <p class="text-[11px] text-slate-400 flex items-center gap-1">
        <i data-lucide="calendar-clock" class="w-3.5 h-3.5"></i>{{ post.valid_until }}まで
        <span class="ml-1">確認日 {{ post.confirmed_at }}</span>
      </p>
    </div>
  </a>
  <button type="button" class="fav-btn absolute top-3 right-3 w-9 h-9 rounded-full bg-white/95 shadow flex items-center justify-center text-slate-400 hover:text-rose-500 transition" data-fav-id="{{ post.id }}" aria-label="お気に入り">
    <i data-lucide="heart" class="w-4.5 h-4.5 pointer-events-none"></i>
  </button>
</article>
{% endmacro %}
