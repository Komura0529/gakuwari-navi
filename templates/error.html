{% extends "base.html" %}
{% block title %}エラー{% endblock %}
{% block content %}
<div class="mt-16 max-w-md mx-auto bg-white rounded-3xl shadow-card p-10 text-center space-y-4">
  <i data-lucide="alert-triangle" class="w-12 h-12 text-amber-400 mx-auto"></i>
  <p class="text-4xl font-black text-slate-300">{{ code }}</p>
  <p class="font-bold">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn bg-brand-600 hover:bg-brand-700 text-white border-none rounded-full px-6">トップに戻る</a>
</div>
{% endblock %}
